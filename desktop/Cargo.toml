[package]
name = "cocirca"
version = "0.1.0"
edition = "2021"
description = "CoCirca desktop: circadian rhythmometry, actograms, rhythm bands, bimodality and circular statistics"
license = "MIT"

[[bin]]
name = "cocirca"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_plot = "0.31"
rayon = "1.10"
statrs = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
csv = "1.3"
calamine = { version = "0.38", features = ["dates"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.79"
rfd = "0.15"
png = "0.17"
flate2 = "1.1.11"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Keep debug builds usable: the analysis maths is slow without optimisation.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
